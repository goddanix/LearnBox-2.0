<?xml version="1.0" encoding="UTF-8"?>
<!-- Learnbox icon: an open box with a small knowledge graph rising out of it.
     The box is the container you fill with lectures; the amber nodes are what
     grows in your head. Flat design source: scripts/make-icons.mjs renders the
     Windows/Linux set from it, scripts/make-icns.mjs the macOS icns. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a2a31"/>
			<stop offset="1" stop-color="#0d0d10"/>
		</linearGradient>
		<linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4a4a54"/>
			<stop offset="1" stop-color="#2c2c33"/>
		</linearGradient>
		<linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#8a8a96"/>
			<stop offset="1" stop-color="#5b5b66"/>
		</linearGradient>
		<radialGradient id="glow" cx="512" cy="450" r="230" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffb454" stop-opacity="0.75"/>
			<stop offset="0.55" stop-color="#ffb454" stop-opacity="0.22"/>
			<stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#ffb454" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<!-- squircle plate -->
	<rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

	<g transform="translate(512 512) scale(1.12) translate(-512 -496)">
	<!-- the box: left and right faces, then the open top -->
	<path d="M296 455 L512 580 L512 830 L296 705 Z" fill="url(#left)"/>
	<path d="M512 580 L728 455 L728 705 L512 830 Z" fill="url(#right)"/>
	<path d="M512 330 L728 455 L512 580 L296 455 Z" fill="#101013"/>
	<path d="M512 330 L728 455 L512 580 L296 455 Z" fill="url(#glow)"/>

	<!-- the graph rising out of the opening -->
	<g stroke="#ffb454" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.92">
		<path d="M512 448 L388 292"/>
		<path d="M512 448 L566 188"/>
		<path d="M512 448 L690 318"/>
		<path d="M388 292 L566 188"/>
		<path d="M566 188 L690 318"/>
	</g>
	<g fill="url(#halo)">
		<circle cx="388" cy="292" r="64"/>
		<circle cx="566" cy="188" r="72"/>
		<circle cx="690" cy="318" r="64"/>
		<circle cx="512" cy="448" r="58"/>
	</g>
	<g fill="#ffcf8a" stroke="#ffb454" stroke-width="8">
		<circle cx="388" cy="292" r="26"/>
		<circle cx="566" cy="188" r="32"/>
		<circle cx="690" cy="318" r="26"/>
		<circle cx="512" cy="448" r="22"/>
	</g>

	<!-- the front rim of the opening and the box edges -->
	<g fill="none" stroke="#e9e9ee" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
		<path d="M296 455 L512 580 L728 455"/>
		<path d="M296 455 L296 705 L512 830 L728 705 L728 455"/>
		<path d="M512 580 L512 830"/>
	</g>
	<path d="M296 455 L512 330 L728 455" fill="none" stroke="#9c9ca8" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
	</g>
</svg>
